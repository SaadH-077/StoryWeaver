[project]
name = "storyweaver"
version = "1.0.0"
description = "StoryWeaver: an agentic, immersive storyteller — hear it, see it, shape it."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Muhammad Saad Haroon" }]
# Core dependencies are everything the stateless API needs (this is what a serverless deployment installs).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langchain-google-genai>=3.0",
    "mcp>=2.0",
    "edge-tts>=7.0",
]

[project.optional-dependencies]
# On-device "studio" voices (Kokoro-82M via ONNX Runtime). Optional: device and cloud voices need nothing local.
local = [
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
eval = [
    "matplotlib>=3.8",
]

[project.scripts]
storyweaver = "storyweaver.__main__:main"
storyweaver-mcp = "storyweaver.mcp_server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storyweaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="StoryWeaver pipeline">
    <rect width="1000" height="440" rx="18" fill="#0f0d1f"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8f88b6"/></marker></defs>
    <text x="16" y="24" fill="#f7c873" font-size="12" font-weight="700" letter-spacing="2">STORY GRAPH · ONE REQUEST, ABOUT TWO MODEL CALLS</text>
    <g><rect x="16" y="80" width="130" height="52" rx="14" fill="rgba(255,255,255,.05)" stroke="#f7c873" stroke-opacity=".7"/>
      <text x="81" y="103" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Your request</text>
      <text x="81" y="120" text-anchor="middle" fill="#a9a3cc" font-size="11">idea · who · length</text></g>
    <g><rect x="168" y="80" width="112" height="52" rx="14" fill="rgba(255,255,255,.05)" stroke="#62e3d2" stroke-opacity=".7"/>
      <text x="224" y="103" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Lexicon</text>
      <text x="224" y="120" text-anchor="middle" fill="#a9a3cc" font-size="11">instant precheck</text></g>
    <g><rect x="304" y="44" width="196" height="52" rx="14" fill="rgba(255,255,255,.05)" stroke="#62e3d2" stroke-opacity=".7"/>
      <text x="402" y="67" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Guardian</text>
      <text x="402" y="84" text-anchor="middle" fill="#a9a3cc" font-size="11">classifier + policy model</text></g>
    <g><rect x="304" y="116" width="196" height="52" rx="14" fill="rgba(255,255,255,.05)" stroke="#a184ff" stroke-opacity=".7"/>
      <text x="402" y="139" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Storyteller</text>
      <text x="402" y="156" text-anchor="middle" fill="#a9a3cc" font-size="11">the whole story, ~2-4 s</text></g>
    <g><rect x="526" y="80" width="128" height="52" rx="14" fill="rgba(255,255,255,.05)" stroke="#62e3d2" stroke-opacity=".7"/>
      <text x="590" y="103" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Gate</text>
      <text x="590" y="120" text-anchor="middle" fill="#a9a3cc" font-size="11">allow/soften/refuse</text></g>
    <g><rect x="678" y="80" width="136" height="52" rx="14" fill="rgba(255,255,255,.05)" stroke="#62e3d2" stroke-opacity=".7"/>
      <text x="746" y="103" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Editor</text>
      <text x="746" y="120" text-anchor="middle" fill="#a9a3cc" font-size="11">every line, no model</text></g>
    <g><rect x="838" y="80" width="146" height="52" rx="14" fill="rgba(255,255,255,.05)" stroke="#f7c873" stroke-opacity=".7"/>
      <text x="911" y="103" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Release</text>
      <text x="911" y="120" text-anchor="middle" fill="#a9a3cc" font-size="11">cast · voices · story</text></g>
    <path d="M146 106 H166" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/>
    <path d="M280 100 C292 100 292 70 302 70" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/><path d="M280 112 C292 112 292 142 302 142" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/>
    <path d="M500 70 C514 70 514 100 524 100" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/><path d="M500 142 C514 142 514 112 524 112" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/>
    <path d="M654 106 H676" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/><path d="M814 106 H836" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/>
    <text x="402" y="186" text-anchor="middle" fill="#a9a3cc" font-size="11">in parallel: safety adds no wait</text>
    <text x="530" y="152" text-anchor="start" fill="#ff8fb3" font-size="11">soften → retold from the safe version</text>
    <text x="230" y="244" fill="#f7c873" font-size="12" font-weight="700" letter-spacing="2">WHILE YOU LISTEN · NOTHING IS GENERATED UNLESS YOU SPEAK</text>
    <g><rect x="16" y="268" width="180" height="56" rx="14" fill="rgba(255,255,255,.05)" stroke="#ff8fb3" stroke-opacity=".7"/>
      <text x="106" y="293" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Director</text>
      <text x="106" y="310" text-anchor="middle" fill="#a9a3cc" font-size="11">plays the written story</text></g>
    <g><rect x="230" y="262" width="176" height="40" rx="14" fill="rgba(255,255,255,.05)" stroke="#f7c873" stroke-opacity=".7"/>
      <text x="318" y="279" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Narrator</text>
      <text x="318" y="296" text-anchor="middle" fill="#a9a3cc" font-size="11">neural voices</text></g>
    <g><rect x="230" y="312" width="176" height="40" rx="14" fill="rgba(255,255,255,.05)" stroke="#f7c873" stroke-opacity=".7"/>
      <text x="318" y="329" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Illustrator</text>
      <text x="318" y="346" text-anchor="middle" fill="#a9a3cc" font-size="11">1 picture per minute</text></g>
    <g><rect x="230" y="362" width="176" height="40" rx="14" fill="rgba(255,255,255,.05)" stroke="#f7c873" stroke-opacity=".7"/>
      <text x="318" y="379" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Composer · Sound</text>
      <text x="318" y="396" text-anchor="middle" fill="#a9a3cc" font-size="11">procedural, live</text></g>
    <g><rect x="440" y="296" width="150" height="56" rx="14" fill="rgba(255,255,255,.05)" stroke="#ff8fb3" stroke-opacity=".7"/>
      <text x="515" y="321" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">You</text>
      <text x="515" y="338" text-anchor="middle" fill="#a9a3cc" font-size="11">listen · look · speak</text></g>
    <g><rect x="626" y="262" width="160" height="40" rx="14" fill="rgba(255,255,255,.05)" stroke="#62e3d2" stroke-opacity=".7"/>
      <text x="706" y="279" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Choice</text>
      <text x="706" y="296" text-anchor="middle" fill="#a9a3cc" font-size="11">both endings ready</text></g>
    <g><rect x="626" y="312" width="160" height="40" rx="14" fill="rgba(255,255,255,.05)" stroke="#82c8ff" stroke-opacity=".7"/>
      <text x="706" y="329" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Question</text>
      <text x="706" y="346" text-anchor="middle" fill="#a9a3cc" font-size="11">1 small call</text></g>
    <g><rect x="626" y="362" width="160" height="40" rx="14" fill="rgba(255,255,255,.05)" stroke="#a184ff" stroke-opacity=".7"/>
      <text x="706" y="379" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Wish</text>
      <text x="706" y="396" text-anchor="middle" fill="#a9a3cc" font-size="11">rewritten from the next line</text></g>
    <g><rect x="820" y="312" width="164" height="40" rx="14" fill="rgba(255,255,255,.05)" stroke="#f7c873" stroke-opacity=".7"/>
      <text x="902" y="329" text-anchor="middle" fill="#f5f2ff" font-size="13.5" font-weight="600">Story continues</text>
      <text x="902" y="346" text-anchor="middle" fill="#a9a3cc" font-size="11">never pauses</text></g>
    <path d="M911 132 V200 Q911 212 899 212 H118 Q106 212 106 224 V266" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/>
    <path d="M196 290 C212 290 212 282 228 282" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/><path d="M196 296 C212 296 212 332 228 332" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/><path d="M196 302 C212 302 212 382 228 382" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/>
    <path d="M406 282 C424 282 424 318 438 318" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/><path d="M406 332 H438" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/><path d="M406 382 C424 382 424 340 438 340" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/>
    <path d="M590 316 C608 316 608 282 624 282" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/><path d="M590 324 H624" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/><path d="M590 332 C608 332 608 382 624 382" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/>
    <path d="M786 282 C804 282 804 324 818 328" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/><path d="M786 332 H818" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/><path d="M786 382 C804 382 804 340 818 336" fill="none" stroke="#8f88b6" stroke-width="1.6"  marker-end="url(#ah)"/>
    <text x="500" y="428" text-anchor="middle" fill="#62e3d2" font-size="11">the host answers a wish at once; the story continues with it from the next sentence — never a pause</text>
  </svg>